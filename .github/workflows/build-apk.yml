name: Build HiNote Studio production from V54.4
on:
  workflow_dispatch:
  push:
    branches: [main, production-v54-4]
  pull_request:
    branches: [main, v54-maintenance, production-v54-4]
permissions:
  contents: read
concurrency:
  group: hinote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/prepare_assets.py
      - run: python .github/scripts/prepare_legal.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-test-results
          path: test-results/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prepare_assets.py
      - run: python .github/scripts/prepare_legal.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon testStableDebugUnitTest testProbeDebugUnitTest testReviewDebugUnitTest testProductionReleaseUnitTest assembleProductionRelease assembleStableDebugAndroidTest
        working-directory: HiNote_Studio_Tablet_Android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: HiNote_Studio_Tablet_Android/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Solo-CI-SIN-FIRMA-No-instalar-HiNote-Studio-1.0.1
          path: HiNote_Studio_Tablet_Android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk
      - name: Verify production artifact and report store readiness
        run: python .github/scripts/verify_production_apk.py HiNote_Studio_Tablet_Android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk --output distribution/apk-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-readiness-report
          path: |
            distribution/apk-verification.json
            distribution/publication-status.json
      - name: Package local signing tool
        run: |
          mkdir -p signing-tools
          signer_path="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -type f | sort -V | tail -n 1)"
          test -n "$signer_path"
          cp "$signer_path" signing-tools/apksigner.jar
          build_tools_dir="$(dirname "$(dirname "$signer_path")")"
          cp "$build_tools_dir/zipalign" signing-tools/zipalign
          mkdir -p signing-tools/lib64
          if [ -d "$build_tools_dir/lib64" ]; then
            find "$build_tools_dir/lib64" -maxdepth 1 -name '*.so*' -exec cp -L {} signing-tools/lib64/ \;
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-signing-tool
          path: signing-tools/
  legal-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prepare_assets.py
      - run: python .github/scripts/prepare_legal.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for the Android UI test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-hinote-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the actual native legal UI on Android 35
        run: bash .github/scripts/run_legal_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-device-results
          path: |
            test-results/legal-device/
            HiNote_Studio_Tablet_Android/app/build/reports/androidTests/
            HiNote_Studio_Tablet_Android/app/build/outputs/androidTest-results/
            HiNote_Studio_Tablet_Android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

  signed-download:
    name: Descarga anterior firmada 1.0.0 (no contiene los cambios de 1.0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Obtener el APK final publicado en Releases
        run: |
          mkdir -p signed-release
          curl --fail --silent --show-error --location --retry 2 --proto '=https' --proto-redir '=https' \
            'https://github.com/Victor55101/HiNote-Studio-Tablet/releases/download/v1.0.0/HiNote-Studio-1.0.0.apk' \
            --output signed-release/HiNote-Studio-1.0.0.apk
          printf '%s  %s\n' '3513daa267dc5bbefa0036b81ea48307c73489cdeb22001ccd9ff7a0d47e88a0' 'HiNote-Studio-1.0.0.apk' > signed-release/SHA256SUMS.txt
          cd signed-release
          sha256sum --check SHA256SUMS.txt
      - name: Verificar la descarga instalable antes de adjuntarla
        run: |
          signer_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -n 1)"
          test -n "$signer_path"
          python3 .github/scripts/verify_production_apk.py signed-release/HiNote-Studio-1.0.0.apk --legacy-1-0-0 \
            --apksigner "$signer_path" \
            --expected-certificate 544fb3ba1fc0b599dbe70c70db294621433559f4b4664585ead097a51ede0cfa \
            --output signed-release/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-Studio-1.0.0-FIRMADO-INSTALABLE
          path: signed-release/
          retention-days: 90
          if-no-files-found: error
