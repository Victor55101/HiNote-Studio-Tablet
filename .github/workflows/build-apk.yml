name: Build HiNote Studio APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source bundle
        run: |
          test -f HiNote_Studio_Tablet_Android_Source.zip || {
            echo "Falta HiNote_Studio_Tablet_Android_Source.zip en la raíz del repositorio."
            exit 1
          }

      - name: Extract Android project
        run: unzip -q -o HiNote_Studio_Tablet_Android_Source.zip

      - name: Patch Chaquopy Android import
        run: |
          sed -i 's/import com\.chaquo\.python\.AndroidPlatform;/import com.chaquo.python.android.AndroidPlatform;/'             HiNote_Studio_Tablet_Android/app/src/main/java/com/hinote/studio/MainActivity.java
          grep -n "AndroidPlatform" HiNote_Studio_Tablet_Android/app/src/main/java/com/hinote/studio/MainActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: HiNote_Studio_Tablet_Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiNote-Studio-Tablet-APK
          path: HiNote_Studio_Tablet_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
