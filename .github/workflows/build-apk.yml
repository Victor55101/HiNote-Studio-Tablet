name: Build HiNote Studio Tablet V37 Pruebas
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hinote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/prepare_assets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-test-results
          path: test-results/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prepare_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon testStableDebugUnitTest testProbeDebugUnitTest assembleStableDebug assembleProbeDebug
        working-directory: HiNote_Studio_Tablet_Android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: HiNote_Studio_Tablet_Android/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-Studio-Tablet-APK-V35
          path: HiNote_Studio_Tablet_Android/app/build/outputs/apk/stable/debug/app-stable-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-Studio-Tablet-APK-V37-Pruebas
          path: HiNote_Studio_Tablet_Android/app/build/outputs/apk/probe/debug/app-probe-debug.apk
      - name: Package local signing tool
        run: |
          mkdir -p signing-tools
          signer_path="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -type f | sort -V | tail -n 1)"
          test -n "$signer_path"
          cp "$signer_path" signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-signing-tool
          path: signing-tools/apksigner.jar
