plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.hinote.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hinote.studio'
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName '2.1-tablet'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
