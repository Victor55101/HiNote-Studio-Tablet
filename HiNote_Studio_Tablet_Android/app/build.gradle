plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.hinote.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hinote.studio'
        minSdk 24
        targetSdk 35
        versionCode 68
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            // The override is only used by the isolated emulator test job.
            abiFilters((project.findProperty('hinoteTestAbi') ?: 'arm64-v8a').toString())
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }
    flavorDimensions 'edition'
    productFlavors {
        production {
            dimension 'edition'
            // Update the user's accepted V54.2-V54.4 installation in place.
            applicationIdSuffix '.v54maintenance'
            buildConfigField 'boolean', 'NOTES_PROBE', 'false'
            manifestPlaceholders = [appLabel: 'HiNote Studio']
        }
        stable {
            dimension 'edition'
            buildConfigField 'boolean', 'NOTES_PROBE', 'false'
            manifestPlaceholders = [appLabel: 'HiNote Studio']
        }
        review {
            dimension 'edition'
            // Preserve V54 and V54.1 installations signed with unavailable CI keys.
            // Delivered maintenance APKs are re-signed with a private, retained key.
            applicationIdSuffix '.v54maintenance'
            buildConfigField 'boolean', 'NOTES_PROBE', 'false'
            manifestPlaceholders = [appLabel: 'HiNote Studio']
        }
        probe {
            dimension 'edition'
            // V34 CI builds used an ephemeral signing key. Install alongside
            // them so the user's existing diagnostic draft is never removed.
            applicationIdSuffix '.probe35'
            versionCode 37
            versionName '3.7-tablet'
            versionNameSuffix '-pruebas'
            buildConfigField 'boolean', 'NOTES_PROBE', 'true'
            manifestPlaceholders = [appLabel: 'HiNote Studio Pruebas V37']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Old generated calibration banks must never be bundled with the new one.
    androidResources { ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:CVS:thumbs.db:picasa.ini:*~:glyphs_v11.json:glyphs_v22.json:glyphs_v23.json' }
    testOptions { unitTests.includeAndroidResources = true }
}

// Building a local production-mode candidate is allowed before the publisher
// identity is complete. Store packaging is a separate, fail-closed operation.
tasks.register('verifyStoreSubmission', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', '.github/scripts/prepare_legal.py', '--require-ready'
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
