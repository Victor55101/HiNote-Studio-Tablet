name: Build HiNote Studio Keyboard Trial V60
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hinote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          enable-hw-keyboard: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: HiNote_Studio_Tablet_Android
          script: bash ../.github/scripts/test_native_keyboard.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-keyboard-results
          path: |
            HiNote_Studio_Tablet_Android/keyboardHarness/build/reports/androidTests/
            HiNote_Studio_Tablet_Android/keyboardHarness/build/outputs/androidTest-results/
            HiNote_Studio_Tablet_Android/keyboardHarness/build/native-logcat.txt
            HiNote_Studio_Tablet_Android/keyboardHarness/build/native-shots/
          if-no-files-found: ignore
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/prepare_assets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-test-results
          path: test-results/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prepare_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon testStableDebugUnitTest testProbeDebugUnitTest testKeyboardTrialDebugUnitTest assembleKeyboardTrialDebug assembleKeyboardTrialDebugAndroidTest
        working-directory: HiNote_Studio_Tablet_Android
      - name: Verify packaged editor and APK signature
        run: python .github/scripts/verify_apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: HiNote_Studio_Tablet_Android/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-Studio-Teclado-Prueba-V60
          path: dist/HiNote-Studio-Teclado-Prueba-V60.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-V60-verification
          path: |
            dist/apk-verification.json
            dist/apk-signature.txt
      - name: Package local signing tool
        run: |
          mkdir -p signing-tools
          signer_path="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -type f | sort -V | tail -n 1)"
          test -n "$signer_path"
          cp "$signer_path" signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-signing-tool
          path: signing-tools/apksigner.jar
