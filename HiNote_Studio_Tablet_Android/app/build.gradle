plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.hinote.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hinote.studio'
        minSdk 24
        targetSdk 35
        versionCode 23
        versionName '2.3-tablet'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Old generated calibration banks must never be bundled with the new one.
    androidResources { ignoreAssetsPattern 'glyphs_v11.json:glyphs_v22.json' }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
