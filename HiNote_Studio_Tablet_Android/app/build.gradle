plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.hinote.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hinote.studio'
        minSdk 24
        targetSdk 35
        versionCode 40
        versionName '4.0-tablet'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }
    flavorDimensions 'edition'
    productFlavors {
        stable {
            dimension 'edition'
            buildConfigField 'boolean', 'NOTES_PROBE', 'false'
            manifestPlaceholders = [appLabel: 'HiNote Studio']
        }
        probe {
            dimension 'edition'
            // V34 CI builds used an ephemeral signing key. Install alongside
            // them so the user's existing diagnostic draft is never removed.
            applicationIdSuffix '.probe35'
            versionCode 37
            versionName '3.7-tablet'
            versionNameSuffix '-pruebas'
            buildConfigField 'boolean', 'NOTES_PROBE', 'true'
            manifestPlaceholders = [appLabel: 'HiNote Studio Pruebas V37']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Old generated calibration banks must never be bundled with the new one.
    androidResources { ignoreAssetsPattern 'glyphs_v11.json:glyphs_v22.json:glyphs_v23.json' }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
