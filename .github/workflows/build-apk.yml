name: Build HiNote Studio Tablet V22
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hinote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/prepare_assets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor.spec.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-test-failures
          path: test-results/
          if-no-files-found: ignore
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prepare_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon assembleDebug
        working-directory: HiNote_Studio_Tablet_Android
      - uses: actions/upload-artifact@v4
        with:
          name: HiNote-Studio-Tablet-APK-V22
          path: HiNote_Studio_Tablet_Android/app/build/outputs/apk/debug/app-debug.apk
